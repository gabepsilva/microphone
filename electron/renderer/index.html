<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TagAlong</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }
      button {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>TagAlong</h1>
    <p id="status">connecting…</p>
    <button id="toggle" type="button">Toggle voice reply</button>
    <script>
      const status = document.getElementById("status");
      const toggle = document.getElementById("toggle");

      async function refresh() {
        const snapshot = await window.tagalong.snapshot();
        status.textContent = snapshot.state.tts_enabled
          ? "Voice reply is on"
          : "Voice reply is off";
      }

      toggle.addEventListener("click", async () => {
        const snapshot = await window.tagalong.snapshot();
        await window.tagalong.dispatch("tts.set_enabled", {
          enabled: !snapshot.state.tts_enabled,
        });
        await refresh();
      });

      refresh().catch((error) => {
        status.textContent = error.message;
      });
    </script>
  </body>
</html>
