rules:
  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: Use argument-list subprocess calls; shell=True permits command injection.
    metadata:
      category: security
      technology: [python]
    pattern: subprocess.$FUNCTION(..., shell=True, ...)

  - id: python-subprocess-string-command
    languages: [python]
    severity: ERROR
    message: Pass an argument list to subprocess; string commands are not permitted.
    metadata:
      category: security
      technology: [python]
    patterns:
      - pattern-either:
          - pattern: subprocess.run($COMMAND, ...)
          - pattern: subprocess.Popen($COMMAND, ...)
          - pattern: subprocess.call($COMMAND, ...)
          - pattern: subprocess.check_call($COMMAND, ...)
          - pattern: subprocess.check_output($COMMAND, ...)
      - metavariable-regex:
          metavariable: $COMMAND
          regex: ^[bBrRfFuU]*(?:"|').*

  - id: python-os-shell-command
    languages: [python]
    severity: ERROR
    message: Do not invoke a shell directly; use a reviewed argument-list subprocess call.
    metadata:
      category: security
      technology: [python]
    pattern-either:
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: python-dynamic-code-execution
    languages: [python]
    severity: ERROR
    message: Do not execute dynamically supplied Python code.
    metadata:
      category: security
      technology: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Do not deserialize untrusted data with pickle or yaml.load.
    metadata:
      category: security
      technology: [python]
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: yaml.load(...)

  - id: python-insecure-tls-verification
    languages: [python]
    severity: ERROR
    message: TLS certificate verification must remain enabled.
    metadata:
      category: security
      technology: [python]
    pattern-either:
      - pattern: requests.$FUNCTION(..., verify=False, ...)
      - pattern: httpx.$FUNCTION(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)

  - id: python-test-fakes-the-unit-under-test
    languages: [python]
    severity: ERROR
    message: >-
      Do not fake tagalong.domain in tests. It is pure logic with no audio,
      process, or network boundary, so replacing it makes the test assert on
      the fake instead of on behavior. Fake adapters, never the subject.
    metadata:
      category: test-integrity
      technology: [python, pytest]
    paths:
      include:
        - tests/
    patterns:
      - pattern-either:
          - pattern: monkeypatch.setattr($TARGET, ...)
          - pattern: monkeypatch.delattr($TARGET, ...)
          - pattern: mock.patch($TARGET, ...)
          - pattern: mock.patch.object($TARGET, ...)
          - pattern: patch($TARGET, ...)
          - pattern: patch.object($TARGET, ...)
      - metavariable-regex:
          metavariable: $TARGET
          regex: ^(["\']tagalong\.domain[.\\'"]|tagalong\.domain\b|domain\.[A-Za-z_]+$)

  # Electron security posture. Explicit paths.include — do not inherit Semgrep
  # defaults over a tree that may contain electron/node_modules (make semgrep
  # mounts the whole repository). Allowlist the safe literal so env flags,
  # Boolean(...), and variable prefs cannot slip past a literal-only match.
  - id: electron-no-node-integration
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      nodeIntegration must stay the literal false; the renderer talks through
      the preload bridge only.
    metadata:
      category: security
      technology: [electron]
    paths:
      include:
        # Anchored at repo root (Semgrepignore v2); do not use a bare
        # electron/src/ that warns and will change meaning.
        - /electron/src/
    patterns:
      - pattern: "nodeIntegration: $X"
      - pattern-not: "nodeIntegration: false"

  - id: electron-no-open-context-isolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      contextIsolation must stay the literal true so the preload bridge remains
      the only renderer surface.
    metadata:
      category: security
      technology: [electron]
    paths:
      include:
        - /electron/src/
    patterns:
      - pattern: "contextIsolation: $X"
      - pattern-not: "contextIsolation: true"

  # Make registerIpcHandlers the sole door: bare ipcMain.handle outside ipc.ts
  # is an orphan-handler hole the CHANNELS map check cannot see.
  - id: electron-ipc-handle-only-via-registrar
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Register IPC handlers only through registerIpcHandlers in
      electron/src/ipc.ts so orphan/map checks stay load-bearing.
    metadata:
      category: security
      technology: [electron]
    paths:
      include:
        - /electron/src/
      exclude:
        - /electron/src/ipc.ts
    pattern: ipcMain.handle(...)
