# Copy this file to voice.yaml for a valid interactive first-run configuration.
# Command-line options override these values.
microphone: null
tts: null
# "piper" synthesizes locally and reaches the first word fastest; "edge" uses
# Microsoft's online voices. Null keeps the default, piper.
tts_provider: null
them_output: null
playback_output: null
codex_after: null
# Left null, these take the built-in defaults: 3.0 seconds, gpt-5.6-luna, low,
# and Codex Fast on — a spoken reply cannot start before the first token, so
# the tier is bought back as latency. Set codex_fast to false to spend fewer
# credits instead.
#
# codex_prefire starts the reply before the turn-silence window closes, so the
# first word lands as the window ends rather than most of a second later. A
# speaker who only paused cancels it, at the cost of the turn it wasted. Set it
# to false to wait out every window in full.
turn_silence: null
codex_model: null
codex_reasoning: null
codex_fast: null
codex_prefire: null
