[project]
name = "voice-codex"
version = "0.1.0"
description = "Always-listening User/Them/Codex conversation assistant"
readme = "features.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edge-tts==7.2.8",
    "moonshine-voice==0.0.73",
    "numpy==2.5.1",
    "openai-codex==0.144.4",
    "rich==15.0.0",
    "sounddevice==0.5.5",
    "textual==8.2.8",
]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.24",
    "bandit>=1.9,<2",
    "diff-cover>=10.4.1,<11",
    "mutmut>=3,<4",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.0,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16.0,<0.17",
    "ty>=0.0.14,<0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv-moonshine"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    # Correctness families for this app's specific hazards: blocking calls in
    # the Textual event loop, naive timestamps in transcripts, and logging
    # call errors that only surface at runtime.
    "ASYNC",
    "DTZ",
    "LOG",
    "G",
    "RET",
    "ARG",
    # Test-suite integrity. PT catches assertions that look strict but are
    # not, such as `pytest.raises` without `match`.
    "PT",
    # Ceilings that stop the untested parts of cli.py from growing further.
    "C901",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
ignore = [
    # Textual and sounddevice callbacks have fixed signatures; unused lambda
    # parameters at those boundaries are required, not accidental.
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "--cov-fail-under=88",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", ".venv-moonshine/*", "tests/*"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_empty = true

[tool.mutmut]
# Scoped to the modules with no audio, process, or network boundary, so every
# surviving mutant is a real assertion gap rather than an untestable adapter.
#
# The extraction this once said to wait for happened on 2026-07-27, and the
# widening was measured rather than assumed. Adding catalog.py alone takes the
# run to 411 mutants with 63 survivors — 84%, against a floor of 94 that must
# not be lowered. catalog.py and choosers.py together: 836 mutants, 256
# survivors, 69%. So the next module is roughly fifty assertions of work, not
# a config edit, and it belongs in its own pull request.
#
# Widening also needs `also_copy = ["voice_codex/"]`: mutmut runs the suite
# against a copy of source_paths alone, and a selected test that imports an
# unlisted sibling makes collection fail rather than the gate.
source_paths = ["voice_codex/domain.py", "voice_codex/config.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_domain.py",
    "tests/test_config.py",
]
# Coverage thresholds must not decide mutant survival; a run scoped to one
# test file would fail the global floor and mark every mutant killed.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]

[tool.bandit]
exclude_dirs = ["tests", ".venv-moonshine"]

[tool.ty.environment]
python-version = "3.12"
