[project]
name = "tagalong"
version = "0.1.0"
description = "An always-on local assistant that hears both sides of your meeting and answers in your ear."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbus-fast==5.0.22 ; sys_platform == 'linux'",
    "edge-tts==7.2.8",
    # Direct: speech render walks CommonMark tokens. Already pulled by Rich /
    # Textual for display markdown; declared here so TTS cleaning does not
    # depend on a transitive import staying put.
    "markdown-it-py==4.2.0",
    "moonshine-voice==0.1.0",
    "numpy==2.5.1",
    "openai-codex==0.144.4",
    "piper-tts==1.6.0",
    "rich==15.0.0",
    "sounddevice==0.5.5",
    "textual==8.2.8",
]

[project.urls]
Homepage = "https://tagalong.you"

# `run_entrypoint` rather than `main`: it is what turns Ctrl-C into "Stopped."
# and a failure into one line instead of a traceback. An installed `tagalong`
# has to behave exactly as `uv run tagalong.py` does.
[project.scripts]
tagalong = "tagalong.cli:run_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo has both a `tagalong` package and a root `tagalong.py` launcher, so
# the wheel contents cannot be inferred. Only the package ships; the launcher
# stays a development convenience.
[tool.hatch.build.targets.wheel]
packages = ["tagalong"]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.24",
    "bandit>=1.9,<2",
    "diff-cover>=10.4.1,<11",
    "mutmut>=3,<4",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.0,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    # Parallel collection/execution for make test / make ci. Mutmut opts out
    # below: forking workers per mutant is slower than serial short runs.
    "pytest-xdist>=3,<4",
    "ruff>=0.16.0,<0.17",
    "ty>=0.0.14,<0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv-moonshine"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    # Correctness families for this app's specific hazards: blocking calls in
    # the Textual event loop, naive timestamps in transcripts, and logging
    # call errors that only surface at runtime.
    "ASYNC",
    "DTZ",
    "LOG",
    "G",
    "RET",
    "ARG",
    # Test-suite integrity. PT catches assertions that look strict but are
    # not, such as `pytest.raises` without `match`.
    "PT",
    # Ceilings that stop the untested parts of cli.py from growing further.
    "C901",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
ignore = [
    # Textual and sounddevice callbacks have fixed signatures; unused lambda
    # parameters at those boundaries are required, not accidental.
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "--cov-fail-under=95",
    # Cap workers so local runs do not thrash the machine. Override with
    # -n0 for a serial run (debugger, mutmut) or -n auto for every core.
    "-n",
    "12",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", ".venv-moonshine/*", "tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true

[tool.mutmut]
# Scoped to the modules with no audio, process, or network boundary, so every
# surviving mutant is a real assertion gap rather than an untestable adapter.
#
# codex.py joined on 2026-07-28, and the cost was what the note here had
# predicted: it took the run from 268 mutants to 706, and the first pass over
# it left 111 survivors — 84%, against a floor of 94. Roughly thirty
# assertions closed that to 94.8%. What they bought is not the number: the
# very first run failed outright on a fake whose ``stream()`` returned a bare
# iterator, which ``_warm_up`` cannot close. That had been killing the worker
# thread silently for as long as the test existed.
#
# catalog.py joined on 2026-07-29. The first honest run had 861 mutants and 71
# survivors (91.2%); assertions on ordering, malformed entries, and the exact
# CLI fallback contract brought that to 36 survivors (95.2%). A trial adding
# choosers.py at the same time produced 1,116 mutants and 146 survivors, so it
# remains the next module-sized change rather than being hidden in this one.
#
# Widening also needs `also_copy = ["tagalong/"]`: mutmut runs the suite
# against a copy of source_paths alone, and a selected test that imports an
# unlisted sibling makes collection fail rather than the gate.
#
# tagalong/control/ joined on 2026-08-05 as a package rather than one module
# at a time: it has no audio, process, or network boundary anywhere in it, so
# the usual reason for staging a join — an adapter whose survivors cannot be
# killed — does not apply. It took the run from 861 mutants to 1,586 and left
# two survivors, both recorded in tools/mutation_gate.py.
#
# tagalong/discovery.py joined on 2026-08-05 for the same reason: it is pure
# data over the catalog and slash table, with no adapter boundary. Leaving it
# out would hide assertion gaps behind a silent non-widening that ratchet
# cannot see. tests/test_discovery.py is in the selection so those mutants
# are scored against the tests that name them.
#
# tagalong/transport.py stays out: it is the Unix-socket / SO_PEERCRED
# boundary. Mutating accept, framing, or peer checks produces survivors that
# can only be "killed" by faking the unit under test. ``json_ready`` lives
# next to ``encode_frame`` as wire serialization, not a second settings
# model; TUI fragment-apply moved to ``tui.py`` with the state it writes.
# Coverage at 100% locks the branches; the controller behind the socket
# remains in scope.
# tagalong/mcp.py stays out with it. McpBridge is a socket adapter. The schema
# helpers are pure, but they only restate the already-mutated catalog; a
# mutant there is a renamed field or a wrong JSON type, and test_mcp.py
# already pins those against CATALOG. Splitting the file just to mutate the
# pure half is a later cleanup, not this milestone.
source_paths = [
    "tagalong/domain.py",
    "tagalong/config.py",
    "tagalong/codex.py",
    "tagalong/catalog.py",
    "tagalong/control/actions.py",
    "tagalong/control/actors.py",
    "tagalong/control/controller.py",
    "tagalong/control/events.py",
    "tagalong/control/outcomes.py",
    "tagalong/control/policy.py",
    "tagalong/control/state.py",
    "tagalong/discovery.py",
]
also_copy = ["tagalong/", "tagalong.py", "tagalong.example.yaml"]
pytest_add_cli_args_test_selection = [
    "tests/test_control_actions.py",
    "tests/test_control_controller.py",
    "tests/test_control_events.py",
    "tests/test_control_policy.py",
    "tests/test_control_state.py",
    "tests/test_domain.py",
    "tests/test_config.py",
    "tests/test_conversation.py",
    "tests/test_discovery.py",
    "tests/test_new_session.py",
    "tests/test_choosers.py",
    "tests/test_remainders.py",
    "tests/test_runtime.py",
    "tests/test_startup.py",
]
# Coverage thresholds must not decide mutant survival; a run scoped to one
# test file would fail the global floor and mark every mutant killed.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider", "-n0"]

[tool.bandit]
exclude_dirs = ["tests", ".venv-moonshine"]

[tool.ty.environment]
python-version = "3.12"
