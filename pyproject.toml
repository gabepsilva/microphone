[project]
name = "voice-codex"
version = "0.1.0"
description = "Always-listening User/Them/Codex conversation assistant"
readme = "features.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edge-tts==7.2.8",
    "moonshine-voice==0.0.73",
    "numpy==2.5.1",
    "openai-codex==0.144.4",
    "rich==15.0.0",
    "sounddevice==0.5.5",
    "textual==8.2.8",
]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.24",
    "bandit>=1.9,<2",
    "diff-cover>=9,<10",
    "mutmut>=3,<4",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.0,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.15",
    "ty>=0.0.14,<0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv-moonshine"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    # Correctness families for this app's specific hazards: blocking calls in
    # the Textual event loop, naive timestamps in transcripts, and logging
    # call errors that only surface at runtime.
    "ASYNC",
    "DTZ",
    "LOG",
    "G",
    "RET",
    "ARG",
    # Test-suite integrity. PT catches assertions that look strict but are
    # not, such as `pytest.raises` without `match`.
    "PT",
    # Ceilings that stop the untested parts of cli.py from growing further.
    "C901",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
ignore = [
    # Textual and sounddevice callbacks have fixed signatures; unused lambda
    # parameters at those boundaries are required, not accidental.
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "--cov-fail-under=87",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", ".venv-moonshine/*", "tests/*"]

[tool.coverage.report]
fail_under = 87
show_missing = true
skip_empty = true

[tool.mutmut]
# Scoped deliberately: domain.py is pure logic with no audio, process, or
# network boundary, so every surviving mutant is a real assertion gap rather
# than an untestable adapter. Widen as logic is extracted from cli.py.
source_paths = ["voice_codex/domain.py"]
pytest_add_cli_args_test_selection = ["tests/test_domain.py"]
# Coverage thresholds must not decide mutant survival; a run scoped to one
# test file would fail the global floor and mark every mutant killed.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]

[tool.bandit]
exclude_dirs = ["tests", ".venv-moonshine"]

[tool.ty.environment]
python-version = "3.12"
